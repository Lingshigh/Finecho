[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finecho-backend"
version = "0.1.0"
description = "FinEcho policy impact attribution and fact-checking backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "langgraph>=0.2,<1",
  "networkx>=3.3,<4",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
rag = ["chromadb>=0.5,<1"]
llm = ["langchain-openai>=0.2,<1"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.6,<1"]

[tool.hatch.build.targets.wheel]
packages = ["agent", "api", "app", "src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

